<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Don't let browsers cache the HTML shell itself (GitHub Pages can't set
       real no-cache headers on the document). The app scripts below are
       loaded with a per-load cache-busting query param (see bottom of file),
       so they never need a manually-bumped ?v= number either. -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>AI Board</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { width: 100%; height: 100%; overflow: hidden; }
    body { background: oklch(0.985 0.004 80); }
  </style>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.21.3/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <!-- SheetJS for Excel parsing -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

  <!-- App source files (order matters: data → ui → import → board).
       Loaded with a cache-busting timestamp query so every page load always
       gets the latest deployed code, without ever needing a manual ?v= bump. -->
  <script>
    (function () {
      var v = Date.now();
      ['data', 'ui', 'import', 'ideas', 'tech-view', 'board'].forEach(function (name) {
        document.write('<script type="text/babel" src="./project/app/' + name + '.jsx?v=' + v + '"><\/script>');
      });
    })();
  </script>
</body>
</html>
